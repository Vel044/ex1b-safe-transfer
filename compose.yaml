# Default deployment: SFT1 plus localhost-only key-authenticated SSH.
name: ex1b-safe-transfer
services:
  server:
    image: ex1b-safe-transfer:ssh
    build:
      context: .
      dockerfile: deploy/Dockerfile.ssh
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:2222:22"
    pids_limit: 256
    mem_limit: 1g
    volumes:
      - ./runtime/container-data:/data
      - ./runtime/server-certs:/certs:ro
      - ./runtime/ssh/authorized_keys:/ssh-authorized-keys:ro
      - ./runtime/ssh/hostkeys:/ssh-hostkeys
      - .:/workspace:ro
      - ssh-home:/home/transfer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; a=socket.create_connection(('127.0.0.1',8443),2); a.close(); b=socket.create_connection(('127.0.0.1',22),2); b.close()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 20s
volumes:
  ssh-home:
