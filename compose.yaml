name: ex1b-safe-transfer
services:
  server:
    image: ex1b-safe-transfer:local
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8443:8443"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - ./runtime/container-data:/data
      - ./runtime/server-certs:/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8443),2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 20s
