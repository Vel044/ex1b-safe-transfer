[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ex1b-safe-transfer"
version = "1.0.0"
description = "SFT1 Transfer: custom secure file transfer protocol and server"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
ex1b = "ex1b.cli:main"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["server"]
testpaths = ["tests"]
